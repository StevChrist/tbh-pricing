<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>$title</title>
  <style>
    /* Reset */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
    body { margin: 0; padding: 0; height: 100% !important; width: 100% !important; }
  </style>
</head>
<body style="background-color: #0f1117; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

  <!-- Outer wrapper -->
  <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
    <tr>
      <td align="center" style="padding: 40px 16px;">

        <!-- Card -->
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 520px;">

          <!-- Header bar -->
          <tr>
            <td align="center" style="background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); border-radius: 12px 12px 0 0; padding: 32px 40px 28px;">
              <p style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 2px; color: #c4b5fd; text-transform: uppercase;">TBH Price Tracker</p>
              <h1 style="margin: 8px 0 0; font-size: 26px; font-weight: 700; color: #ffffff; line-height: 1.3;">$title</h1>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="background-color: #1a1d27; padding: 36px 40px 28px; border-left: 1px solid #2d2f3e; border-right: 1px solid #2d2f3e;">

              <!-- Subtitle -->
              <p style="margin: 0 0 24px; font-size: 15px; color: #9ca3af; line-height: 1.6; text-align: center;">$subtitle</p>

              <!-- OTP Block -->
              <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="center" style="padding: 0 0 24px;">
                    <div style="display: inline-block; background: linear-gradient(135deg, #1e2035 0%, #252840 100%); border: 1px solid #4f46e5; border-radius: 12px; padding: 20px 40px;">
                      <p style="margin: 0 0 4px; font-size: 11px; font-weight: 600; letter-spacing: 2px; color: #6366f1; text-transform: uppercase;">Your verification code</p>
                      <p style="margin: 0; font-size: 42px; font-weight: 800; letter-spacing: 10px; color: #ffffff; font-family: 'Courier New', Courier, monospace;">$otp</p>
                    </div>
                  </td>
                </tr>
              </table>

              <!-- Expiry notice -->
              <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="center" style="padding: 0 0 20px;">
                    <p style="margin: 0; font-size: 13px; color: #6b7280; line-height: 1.5;">
                      ⏱ This code expires in <strong style="color: #f59e0b;">$expire_minutes minutes</strong>.<br />
                      Do not share this code with anyone.
                    </p>
                  </td>
                </tr>
              </table>

              <!-- Divider -->
              <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td style="border-top: 1px solid #2d2f3e; padding-top: 20px;">
                    <p style="margin: 0; font-size: 12px; color: #4b5563; line-height: 1.6; text-align: center;">
                      If you did not request this code, you can safely ignore this email.<br />
                      Someone may have entered your email by mistake.
                    </p>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="background-color: #13151f; border: 1px solid #2d2f3e; border-top: none; border-radius: 0 0 12px 12px; padding: 20px 40px;">
              <p style="margin: 0; font-size: 12px; color: #4b5563; line-height: 1.6;">$footer</p>
            </td>
          </tr>

        </table>
        <!-- /Card -->

      </td>
    </tr>
  </table>

</body>
</html>
